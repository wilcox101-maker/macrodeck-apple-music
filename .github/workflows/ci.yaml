name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (windows-latest)
    # Windows only, matching the single declared platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AppleMusicControl.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test AppleMusicControl.slnx -c Release --no-build

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.17

      # --project cannot pick a framework of a multi-targeted project, so the Windows build is passed directly.
      - name: Conformance
        run: macrodeck-plugin test --executable "${{ github.workspace }}/src/AppleMusicControl/bin/Release/net10.0-windows10.0.19041.0/AppleMusicControl.dll" --required-only

  package:
    name: Pack and validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.17

      - name: Build the package
        run: macrodeck-plugin build --source src/AppleMusicControl --output ./artifacts

      - name: Validate the package
        run: macrodeck-plugin validate --level publication --artifact ./artifacts/*.macroDeckPlugin
